apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-tracker-api
  namespace: job-tracker
  labels:
    app: job-tracker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-tracker-api
  template:
    metadata:
      labels:
        app: job-tracker-api
    spec:
      containers:
        - name: job-tracker-api
          image: 631534401204.dkr.ecr.ca-central-1.amazonaws.com/job-tracker-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: job-tracker-api-config
            - secretRef:
                name: job-tracker-api-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
