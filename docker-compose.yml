services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobapi
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpassword@db:5432/jobtracker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: jobtracker-db
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
